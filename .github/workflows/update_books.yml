name: Update Currently Reading SVG

on:
  # MAL has no webhooks, so poll the manga list every 15 minutes.
  # The SVGs are only committed when a chapter/status change shows up.
  schedule:
    - cron: '*/15 * * * *'
  # Triggers the action when you push changes to the script
  push:
    paths:
      - 'update_books.py'
      - '.github/workflows/update_books.yml'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Don't let a slow run overlap with the next poll
concurrency:
  group: update-books
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to allow the bot to push commits to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install Pillow

      - name: Run Python Script
        env:
          MAL_USERNAME: Homuresu
        run: python update_books.py

      - name: Commit and Push Changes
        run: |
          # Set up the bot's identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the updated SVGs
          git add darkmode.svg lightmode.svg

          # Only commit if there are actual changes, preventing pipeline failures
          git diff --staged --quiet && exit 0
          git commit -m "Auto-update currently reading manga"

          # The stats workflow also pushes to main, so rebase onto it before pushing
          git pull --rebase
          git push
