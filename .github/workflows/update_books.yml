name: Update Currently Reading SVG

on:
  # MAL has no webhooks, so poll the manga list every 15 minutes.
  # The SVGs are only committed when a chapter/status change shows up.
  schedule:
    - cron: '*/15 * * * *'
  # Triggers the action when you push changes to the script
  push:
    paths:
      - 'update_books.py'
      - '.github/workflows/update_books.yml'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Don't let a slow run overlap with the next poll
concurrency:
  group: update-books
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to allow the bot to push commits to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install Pillow

      - name: Update SVGs and Push Changes
        env:
          MAL_USERNAME: Homuresu
        run: |
          # Set up the bot's identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            python update_books.py

            # Stage the updated SVGs
            git add darkmode.svg lightmode.svg

            # Only commit if there are actual changes, preventing pipeline failures
            git diff --staged --quiet && exit 0
            git commit -m "Auto-update currently reading manga"
            git push && exit 0
  
            # The stats workflow also rewrites these SVGs, and git can't merge the two edits. Throw away our commit and regenerate on top of the latest main.
            echo "Push rejected, rebuiling on latest main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            sleep 5
          done
          exit 1
